[phases.setup]
nixPkgs = ["python311", "gcc", "ffmpeg", "freetype", "fontconfig", "dejavu_fonts"]

[phases.install]
cmds = ["python3 -m venv /opt/venv", "/opt/venv/bin/pip install --upgrade pip", "/opt/venv/bin/pip install -r requirements.txt"]

[start]
cmd = "PYTHONPATH=. /opt/venv/bin/python creative_intelligence/webapp/app.py"

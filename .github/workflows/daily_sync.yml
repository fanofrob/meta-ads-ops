name: Daily Meta Ads Sync

on:
  schedule:
    # 4:30am UTC = 4:30am WET (winter) / 5:30am WEST (summer) — runs before 6am Lisbon trigger
    - cron: "30 4 * * *"
  workflow_dispatch:  # allow manual runs from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install requests python-dotenv google-auth google-auth-httplib2 google-api-python-client

      - name: Write Google service account credentials
        run: |
          mkdir -p credentials
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > credentials/sheets_service_account.json

      - name: Write .env
        run: |
          cat > .env <<EOF
          META_ACCESS_TOKEN=${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID=${{ secrets.META_AD_ACCOUNT_ID }}
          META_API_VERSION=${{ secrets.META_API_VERSION }}
          META_ADS_SNAPSHOT_FILE_ID=${{ secrets.META_ADS_SNAPSHOT_FILE_ID }}
          EOF

      - name: Fetch campaigns
        working-directory: ${{ github.workspace }}
        run: python src/fetch_campaigns.py

      - name: Fetch ad sets
        working-directory: ${{ github.workspace }}
        run: python src/fetch_adsets.py

      - name: Fetch insights (yesterday)
        working-directory: ${{ github.workspace }}
        run: python src/fetch_insights.py

      - name: Fetch insights (7d)
        working-directory: ${{ github.workspace }}
        run: python src/fetch_insights.py --last7d

      - name: Generate daily report
        working-directory: ${{ github.workspace }}
        run: python src/report.py

      - name: Export snapshot to GHF Oracle
        working-directory: ${{ github.workspace }}
        env:
          META_ADS_SNAPSHOT_FILE_ID: ${{ secrets.META_ADS_SNAPSHOT_FILE_ID }}
        run: python src/export_to_oracle.py

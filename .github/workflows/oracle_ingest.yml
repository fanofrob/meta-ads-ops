name: GHF Oracle Ingestion

on:
  schedule:
    # 9:00am UTC — runs after the 4:30am meta ads pipeline
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install google-auth google-auth-httplib2 google-api-python-client tiktoken openai pypdf python-dotenv requests

      - name: Write Google service account credentials
        run: |
          mkdir -p credentials
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > credentials/sheets_service_account.json

      - name: Debug secrets
        run: |
          echo "SUPABASE_URL length: ${#SUPABASE_URL}"
          echo "SUPABASE_URL starts with: ${SUPABASE_URL:0:10}"
          echo "SUPABASE_SERVICE_KEY length: ${#SUPABASE_SERVICE_KEY}"
          python -c "import urllib.request; urllib.request.urlopen('$SUPABASE_URL/rest/v1/', timeout=10)" && echo "Supabase reachable" || echo "Supabase NOT reachable"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Run ingestion
        run: python src/oracle_ingest.py
        timeout-minutes: 10
        env:
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

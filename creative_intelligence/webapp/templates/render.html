<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Static Render Review</title>
<style>
:root {
  --bg:       #0d0d14;
  --surface:  #13131e;
  --surface2: #1a1a2a;
  --border:   #252535;
  --text:     #e8e8f0;
  --text2:    #b0b0c8;
  --muted:    #6a6a88;
  --muted2:   #44445a;
  --accent:   #4f46e5;
  --accent2:  #818cf8;
  --green:    #4ade80;
  --gold:     #fbbf24;
  --orange:   #fb923c;
  --blue:     #60a5fa;
  --purple:   #c084fc;
  --red:      #f87171;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }

/* ── Layout ── */
header { display: flex; align-items: center; gap: 12px; padding: 10px 20px; border-bottom: 1px solid var(--border); background: var(--surface); }
header h1 { font-size: 15px; font-weight: 700; letter-spacing: -.3px; }
header .subtitle { font-size: 12px; color: var(--muted); }
.nav-link { margin-left: auto; font-size: 12px; color: var(--accent2); text-decoration: none; }
.nav-link:hover { text-decoration: underline; }

.layout { display: flex; height: calc(100vh - 44px); overflow: hidden; }

/* ── Sidebar ── */
.sidebar { width: 280px; flex-shrink: 0; border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
.sidebar-top { padding: 12px 16px; border-bottom: 1px solid var(--border); }
.sidebar-top h3 { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; }
.sidebar-list { flex: 1; overflow-y: auto; padding: 8px 0; }
.render-item { padding: 10px 16px; cursor: pointer; border-left: 2px solid transparent; transition: background .1s; }
.render-item:hover { background: var(--surface2); }
.render-item.active { border-left-color: var(--accent); background: var(--surface2); }
.render-item .ri-concept { font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.render-item .ri-meta { font-size: 11px; color: var(--muted); margin-top: 2px; display: flex; gap: 6px; align-items: center; }
.status-badge { font-size: 10px; padding: 1px 6px; border-radius: 8px; border: 1px solid; }
.status-spec-only   { border-color: var(--border); color: var(--muted); }
.status-images-generated { border-color: #166534; color: var(--green); }
.status-images-failed { border-color: #7c2d12; color: var(--orange); }
.status-pending { border-color: var(--border); color: var(--muted); }

/* ── Main ── */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--muted); gap: 8px; }
.empty-state h2 { font-size: 16px; }
.empty-state p  { font-size: 13px; }

/* ── Render detail ── */
.render-detail { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

/* Top bar */
.detail-header { padding: 12px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.detail-header-row1 { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.detail-header-row1 h2 { font-size: 14px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.detail-actions { display: flex; gap: 6px; flex-shrink: 0; }
.btn { font-size: 11px; padding: 5px 10px; border-radius: 6px; cursor: pointer; border: 1px solid var(--border); background: transparent; color: var(--muted); transition: all .12s; }
.btn:hover { border-color: var(--accent); color: var(--text); }
.btn.approved { border-color: #166534; color: var(--green); background: #052e16; }
.btn.fav { border-color: var(--gold); color: var(--gold); }
.btn-export { background: var(--surface2); }
.btn-danger { border-color: #7c2d12; color: var(--red); }
.btn-danger:hover { background: #2a0e07; }

/* Summary pills */
.summary-pills { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
.pill { font-size: 11px; padding: 2px 9px; border-radius: 10px; border: 1px solid var(--border); color: var(--text2); background: var(--surface2); white-space: nowrap; }
.pill.p-approved { border-color: #166534; color: var(--green); background: #052e16; }
.pill.p-rejected { border-color: #7c2d12; color: var(--red); background: #2a0e07; }
.pill.p-fav { border-color: #92400e; color: var(--gold); background: #1c1200; }
.pill.p-ready { border-color: #1e3a5f; color: var(--blue); background: #071828; }

/* View toggle */
.view-toolbar { display: flex; align-items: center; gap: 8px; }
.view-btn { font-size: 11px; padding: 3px 8px; border-radius: 5px; cursor: pointer; border: 1px solid var(--border); background: transparent; color: var(--muted); }
.view-btn.active { border-color: var(--accent2); color: var(--accent2); background: rgba(79,70,229,.1); }

/* ── Cards feed ── */
.cards-feed { flex: 1; overflow-y: auto; padding: 16px 20px; }
.cards-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.cards-large { display: grid; grid-template-columns: 1fr; gap: 16px; max-width: 680px; }

/* Ready-to-test highlighted section */
.ready-section { margin-bottom: 16px; }
.ready-section-title { font-size: 11px; color: var(--blue); text-transform: uppercase; letter-spacing: .7px; margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid #1e3a5f; }

/* ── Variant card ── */
.variant-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  transition: border-color .15s, background .15s;
  position: relative;
  outline: none;
}
.variant-card:hover, .variant-card:focus { border-color: var(--accent2); }
.variant-card.state-approved { border-left: 4px solid #4ade80; background: #030f08; }
.variant-card.state-rejected  { border-left: 4px solid #f87171; background: #0f0505; }
.variant-card.state-favorite  { border-color: var(--gold); }

/* Card header */
.card-header { display: flex; align-items: center; gap: 8px; padding: 9px 12px; }
.variant-badge { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 10px; text-transform: uppercase; letter-spacing: .5px; flex-shrink: 0; }
.badge-minimal           { background: #0c2040; color: #5ba4e8; }
.badge-bold-type         { background: #1a0a2a; color: #c084fc; }
.badge-benefit-stack     { background: #2a1200; color: #fb923c; }
.badge-social-proof      { background: #0a2a1a; color: #4ade80; }
.badge-origin-story      { background: #1a2a0a; color: #a3e635; }
.badge-lifestyle-tagline { background: #2a1a0a; color: #fbbf24; }
.badge-direct-response   { background: #2a0a0a; color: #f87171; }
.badge-premium           { background: #1a1a0c; color: #d4af37; }
.badge-scroll-stopping   { background: #1a0a1a; color: #e879f9; }
.card-rationale { font-size: 11px; color: var(--muted); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.spec-toggle { font-size: 10px; color: var(--muted2); cursor: pointer; background: none; border: none; padding: 2px 6px; border-radius: 4px; white-space: nowrap; }
.spec-toggle:hover { color: var(--text2); background: var(--surface2); }

/* Image area */
.card-image-wrap { position: relative; background: var(--surface2); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); overflow: hidden; }
.card-image { width: 100%; display: block; object-fit: contain; max-height: 380px; }
.card-image-placeholder { padding: 32px 16px; text-align: center; color: var(--muted); font-size: 11px; font-family: monospace; word-break: break-all; }
.ready-badge-corner { position: absolute; top: 8px; right: 8px; background: #071828; border: 1px solid #1e3a5f; color: var(--blue); font-size: 10px; padding: 3px 7px; border-radius: 6px; }
.bg-toggle-btn { position: absolute; bottom: 8px; right: 8px; background: rgba(13,13,20,.8); border: 1px solid var(--border); color: var(--text2); font-size: 10px; padding: 3px 8px; border-radius: 6px; cursor: pointer; backdrop-filter: blur(4px); transition: all .12s; z-index: 2; }
.bg-toggle-btn:hover { border-color: var(--accent2); color: var(--text); }
.asset-type-badge { position: absolute; bottom: 8px; right: 8px; background: rgba(13,13,20,.75); border: 1px solid #1e3a5f; color: var(--blue); font-size: 10px; padding: 3px 7px; border-radius: 6px; pointer-events: none; }

/* Overlay copy */
.card-copy { padding: 10px 12px; border-bottom: 1px solid var(--border); }
.card-headline { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 3px; }
.card-cta { font-size: 11px; color: var(--accent2); }

/* Action buttons */
.card-actions { display: flex; align-items: center; gap: 6px; padding: 8px 12px; flex-wrap: wrap; }
.action-btn { font-size: 11px; padding: 4px 9px; border-radius: 6px; cursor: pointer; border: 1px solid var(--border); background: transparent; color: var(--muted); transition: all .1s; white-space: nowrap; }
.action-btn:hover { border-color: var(--accent); color: var(--text); }
.action-btn.active-approve { border-color: #166534; color: var(--green); background: #052e16; }
.action-btn.active-reject  { border-color: #7c2d12; color: var(--red); background: #2a0e07; }
.action-btn.active-fav     { border-color: #92400e; color: var(--gold); background: #1c1200; }
.action-btn.active-ready   { border-color: #1e3a5f; color: var(--blue); background: #071828; }
.download-link { font-size: 11px; color: var(--muted); text-decoration: none; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border); margin-left: auto; }
.download-link:hover { color: var(--text); border-color: var(--accent); }

/* Spec detail (collapsible) */
.spec-detail { overflow: hidden; max-height: 0; transition: max-height .35s ease, padding .25s ease; padding: 0 12px; }
.spec-detail.open { max-height: 6000px; padding: 10px 12px 14px; }

/* Edit prompt panel */
.edit-panel { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-top: 8px; }
.edit-panel label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .7px; display: block; margin-bottom: 4px; }
.edit-textarea { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 8px 10px; font-size: 12px; line-height: 1.6; font-family: inherit; resize: vertical; min-height: 80px; }
.edit-textarea:focus { outline: none; border-color: var(--accent); }
.edit-notes { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text2); padding: 6px 10px; font-size: 12px; font-family: inherit; resize: none; height: 52px; margin-top: 6px; }
.edit-notes:focus { outline: none; border-color: var(--accent); }
.edit-actions { display: flex; gap: 6px; margin-top: 8px; align-items: center; }
.btn-regen { font-size: 11px; padding: 5px 12px; border-radius: 6px; cursor: pointer; border: 1px solid var(--accent); background: transparent; color: var(--accent2); transition: all .1s; white-space: nowrap; }
.btn-regen:hover { background: var(--accent); color: #fff; }
.btn-regen:disabled { opacity: .4; cursor: not-allowed; }
.btn-edit-cancel { font-size: 11px; padding: 5px 10px; border-radius: 6px; cursor: pointer; border: 1px solid var(--border); background: transparent; color: var(--muted); }
.btn-edit-cancel:hover { color: var(--text); border-color: var(--text2); }
.regen-status { font-size: 11px; color: var(--muted); }
.spec-section { margin-bottom: 10px; }
.spec-section h5 { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .7px; margin-bottom: 5px; }
.spec-section p, .spec-section .prompt-text { font-size: 12px; line-height: 1.6; color: var(--text2); }
.prompt-box { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; font-size: 12px; line-height: 1.6; color: var(--text2); font-family: inherit; white-space: pre-wrap; word-break: break-word; }
.overlay-grid { display: grid; grid-template-columns: 70px 1fr; gap: 4px 8px; font-size: 12px; }
.overlay-label { color: var(--muted); font-size: 11px; }
.style-tags { display: flex; flex-wrap: wrap; gap: 5px; }
.style-tag { font-size: 10px; padding: 2px 7px; border-radius: 8px; background: var(--surface2); border: 1px solid var(--border); color: var(--muted); }

/* Model picker panel */
.model-panel { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 7px; }
.model-panel label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .7px; }
.model-select { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 5px 8px; font-size: 12px; }
.model-select:focus { outline: none; border-color: var(--accent); }
.model-custom { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; color: var(--text2); padding: 5px 8px; font-size: 11px; font-family: monospace; display: none; }
.model-custom.visible { display: block; }
.model-custom:focus { outline: none; border-color: var(--accent); }

/* Variant checkboxes */
.variant-checks { display: flex; flex-direction: column; gap: 4px; }
.variant-check-row { display: flex; align-items: center; gap: 7px; cursor: pointer; padding: 2px 0; }
.variant-check-row input[type=checkbox] { accent-color: var(--accent); cursor: pointer; }
.variant-check-row .vc-badge { font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 8px; text-transform: uppercase; letter-spacing: .4px; flex-shrink: 0; }
.variant-check-row .vc-label { font-size: 11px; color: var(--text2); }

.btn-gen-images { width: 100%; padding: 7px; border-radius: 6px; border: 1px solid var(--accent); background: transparent; color: var(--accent2); font-size: 12px; cursor: pointer; transition: all .12s; }
.btn-gen-images:hover { background: var(--accent); color: #fff; }
.btn-gen-images:disabled { opacity: .4; cursor: not-allowed; }

/* Shortcut hint */
.shortcut-hint { font-size: 10px; color: var(--muted2); padding: 4px 20px 0; }

/* Toast */
#toast { position: fixed; bottom: 16px; right: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 14px; font-size: 12px; box-shadow: 0 4px 16px #0006; opacity: 0; transform: translateY(6px); transition: all .2s; pointer-events: none; z-index: 999; }
#toast.show { opacity: 1; transform: translateY(0); }

/* Scrollbar */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<header>
  <h1>Static Render Review</h1>
  <span class="subtitle">Spec-first rendering · per-variant decision layer</span>
  <a class="nav-link" href="/collection" style="margin-left:auto">Collection →</a>
  <a class="nav-link" href="/copilot" style="margin-left:12px">← Copilot</a>
</header>

<div class="layout">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-top"><h3>Render Outputs</h3></div>

    <!-- Model picker + variant selector -->
    <div class="model-panel">
      <label>Image Model</label>
      <select class="model-select" id="modelSelect" onchange="onModelChange(this)">
        <option value="google/nano-banana-pro">Google Nano Banana Pro ✦</option>
        <option value="stability-ai/stable-diffusion-3.5-large-turbo">SD 3.5 Large Turbo (fast)</option>
        <option value="stability-ai/stable-diffusion-3.5-large">SD 3.5 Large (quality)</option>
        <option value="black-forest-labs/flux-1.1-pro">FLUX 1.1 Pro</option>
        <option value="black-forest-labs/flux-schnell">FLUX Schnell (fast)</option>
        <option value="black-forest-labs/flux-dev">FLUX Dev</option>
        <option value="ideogram-ai/ideogram-v2">Ideogram V2</option>
        <option value="recraft-ai/recraft-v3">Recraft V3</option>
        <option value="custom">Custom model slug…</option>
      </select>
      <input class="model-custom" id="modelCustom" placeholder="owner/model-name or owner/model-name:version" />

      <label style="margin-top:4px">Aspect Ratio</label>
      <select class="model-select" id="aspectRatioSelect">
        <option value="9:16">9:16 — Portrait / Stories</option>
        <option value="4:5">4:5 — Feed Portrait</option>
        <option value="1:1">1:1 — Square</option>
        <option value="16:9">16:9 — Landscape</option>
      </select>

      <label style="margin-top:4px">Variants to generate</label>
      <div class="variant-checks">
        <label class="variant-check-row">
          <input type="checkbox" value="minimal" checked>
          <span class="vc-badge badge-minimal">Minimal</span>
          <span class="vc-label">Pure product, zero text</span>
        </label>
        <label class="variant-check-row">
          <input type="checkbox" value="bold_type" checked>
          <span class="vc-badge badge-bold-type">Bold Type</span>
          <span class="vc-label">Text is the hero, product secondary</span>
        </label>
        <label class="variant-check-row">
          <input type="checkbox" value="benefit_stack" checked>
          <span class="vc-badge badge-benefit-stack">Benefit Stack</span>
          <span class="vc-label">Colour block + stacked trust lines</span>
        </label>
        <label class="variant-check-row">
          <input type="checkbox" value="social_proof" checked>
          <span class="vc-badge badge-social-proof">Social Proof</span>
          <span class="vc-label">Review card with stars + quote</span>
        </label>
        <label class="variant-check-row">
          <input type="checkbox" value="origin_story" checked>
          <span class="vc-badge badge-origin-story">Origin Story</span>
          <span class="vc-label">Farm/orchard background, provenance</span>
        </label>
        <label class="variant-check-row">
          <input type="checkbox" value="lifestyle_tagline" checked>
          <span class="vc-badge badge-lifestyle-tagline">Lifestyle Tagline</span>
          <span class="vc-label">Emotional brand statement</span>
        </label>
        <label class="variant-check-row">
          <input type="checkbox" value="direct_response" checked>
          <span class="vc-badge badge-direct-response">Direct Response</span>
          <span class="vc-label">Headline + body + CTA button</span>
        </label>
        <label class="variant-check-row">
          <input type="checkbox" value="premium" checked>
          <span class="vc-badge badge-premium">Premium</span>
          <span class="vc-label">White bg, elegant product label</span>
        </label>
        <label class="variant-check-row">
          <input type="checkbox" value="scroll_stopping" checked>
          <span class="vc-badge badge-scroll-stopping">Scroll Stopping</span>
          <span class="vc-label">Wild claim / absurd 1-star review / pattern interrupt</span>
        </label>
      </div>

      <button class="btn-gen-images" id="genImagesBtn" onclick="generateImages()" disabled>
        Generate Images
      </button>
    </div>

    <div class="sidebar-list" id="renderList">
      <div style="padding:16px;color:var(--muted);font-size:12px">Loading…</div>
    </div>
  </div>

  <!-- Main area -->
  <div class="main" id="mainArea">
    <div class="empty-state">
      <h2>Select a render output</h2>
      <p>Or go to <a href="/copilot" style="color:var(--accent2)">Copilot</a> → generate a Static Brief → click Render</p>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ─── State ─────────────────────────────── */
let currentRenderId   = null;
let currentViewMode   = 'grid'; // 'grid' | 'large'
let currentFocusedAssetId = null;
// assetState: { [assetId]: { review_status, is_favorite, is_ready_to_test } }
let assetState = {};
// currentSpecs: the render_specs array for the active render
let currentSpecs = [];
// currentDisplayedAssetIds: Set of asset IDs actually shown in cards (deduped, latest per variant)
let currentDisplayedAssetIds = new Set();

/* ─── Boot ──────────────────────────────── */
document.addEventListener('DOMContentLoaded', () => {
  loadRenderList();
  const hash = parseInt(location.hash.replace('#',''));
  if (hash) setTimeout(() => selectRender(hash), 400);

  // Keyboard shortcuts
  document.addEventListener('keydown', e => {
    if (!currentFocusedAssetId) return;
    // Ignore if typing in an input
    if (['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)) return;
    const key = e.key.toLowerCase();
    if (key === 'a') { e.preventDefault(); assetApprove(currentFocusedAssetId); }
    if (key === 'r') { e.preventDefault(); assetReject(currentFocusedAssetId); }
    if (key === 'f') { e.preventDefault(); assetFavorite(currentFocusedAssetId); }
    if (key === 't') { e.preventDefault(); assetReady(currentFocusedAssetId); }
  });
});

/* ─── Helpers ───────────────────────────── */
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function toast(msg, err=false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.color = err ? 'var(--orange)' : 'var(--text)';
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

/* ─── Sidebar list ──────────────────────── */
async function loadRenderList() {
  const list = document.getElementById('renderList');
  try {
    const res   = await fetch('/api/render/list');
    const items = await res.json();
    if (!items.length) {
      list.innerHTML = '<div style="padding:16px;color:var(--muted);font-size:12px">No render outputs yet.</div>';
      return;
    }
    list.innerHTML = items.map(it => {
      const statusClass = {
        'spec_only':        'status-spec-only',
        'images_generated': 'status-images-generated',
        'images_failed':    'status-images-failed',
        'pending':          'status-pending',
      }[it.status] || 'status-pending';
      const label = (it.status || 'pending').replace(/_/g,' ');
      const concept = (it.concept_text || '—').slice(0, 60);
      const date = (it.created_at || '').slice(0,10);
      const fav  = it.is_favorite ? ' ★' : '';
      const appr = it.is_approved ? ' ✓' : '';
      return `
        <div class="render-item" data-id="${it.id}" onclick="selectRender(${it.id})">
          <div class="ri-concept">${esc(concept)}${fav}${appr}</div>
          <div class="ri-meta">
            <span class="status-badge ${statusClass}">${esc(label)}</span>
            <span>${esc(date)}</span>
          </div>
        </div>`;
    }).join('');
  } catch(e) {
    list.innerHTML = '<div style="padding:16px;color:var(--orange);font-size:12px">Failed to load.</div>';
  }
}

/* ─── Model picker ──────────────────────── */
function onModelChange(sel) {
  const custom = document.getElementById('modelCustom');
  if (sel.value === 'custom') {
    custom.classList.add('visible');
    custom.focus();
  } else {
    custom.classList.remove('visible');
  }
}

function getSelectedModel() {
  const sel = document.getElementById('modelSelect');
  if (sel.value === 'custom') {
    return document.getElementById('modelCustom').value.trim() || null;
  }
  return sel.value;
}

function getSelectedVariants() {
  return Array.from(
    document.querySelectorAll('.variant-checks input[type=checkbox]:checked')
  ).map(cb => cb.value);
}

function getSelectedAspectRatio() {
  return document.getElementById('aspectRatioSelect')?.value || '9:16';
}

async function generateImages() {
  if (!currentRenderId) return;
  const variants = getSelectedVariants();
  if (!variants.length) { toast('Select at least one variant', true); return; }
  const btn   = document.getElementById('genImagesBtn');
  const model = getSelectedModel();
  btn.disabled = true;
  btn.textContent = `Generating ${variants.length} variant${variants.length>1?'s':''}…`;
  toast('Sending to ' + (model || 'default model') + '…');
  try {
    const detailRes = await fetch(`/api/render/${currentRenderId}`);
    const detail    = await detailRes.json();
    const res = await fetch('/api/render/generate', {
      method:  'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        production_output_id: detail.source_production_output_id,
        generate_images:      true,
        model:                model,
        variants:             variants,
        aspect_ratio:         getSelectedAspectRatio(),
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
    toast(`✓ ${variants.length} variant${variants.length>1?'s':''} generated — loading…`);
    await loadRenderList();
    selectRender(data.render_output_id);
  } catch(e) {
    toast('Generation failed: ' + e.message, true);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Generate Images';
  }
}

/* ─── Select render ─────────────────────── */
async function selectRender(id) {
  currentRenderId = id;
  location.hash = id;
  const btn = document.getElementById('genImagesBtn');
  if (btn) btn.disabled = false;

  document.querySelectorAll('.render-item').forEach(el => {
    el.classList.toggle('active', parseInt(el.dataset.id) === id);
  });

  const main = document.getElementById('mainArea');
  main.innerHTML = '<div class="empty-state"><p style="color:var(--muted)">Loading…</p></div>';
  assetState = {};
  currentSpecs = [];
  currentFocusedAssetId = null;
  currentDisplayedAssetIds = new Set();

  try {
    const res  = await fetch(`/api/render/${id}`);
    if (!res.ok) { main.innerHTML = `<div class="empty-state"><p style="color:var(--orange)">Not found.</p></div>`; return; }
    const data = await res.json();
    renderDetail(data);
  } catch(e) {
    main.innerHTML = `<div class="empty-state"><p style="color:var(--orange)">Error: ${esc(e.message)}</p></div>`;
  }
}

/* ─── Render detail ─────────────────────── */
function renderDetail(data) {
  const main   = document.getElementById('mainArea');
  const specs  = data.render_specs || [];
  currentSpecs = specs;
  const assets = data.assets || [];
  const title  = data.concept_text ? data.concept_text.slice(0,60) : `Render #${data.id}`;

  // Build asset state cache and separate maps by asset_type
  const finalMap = {};   // variant_label → latest 'final_ad' asset
  const bgMap    = {};   // variant_label → latest 'background' or 'image_variant' asset
  assets.forEach(a => {
    assetState[a.id] = {
      review_status:    a.review_status    || 'pending',
      is_favorite:      a.is_favorite      || 0,
      is_ready_to_test: a.is_ready_to_test || 0,
    };
    const atype = a.asset_type || 'image_variant';
    if (atype === 'final_ad') {
      if (!finalMap[a.variant_label] || a.id > finalMap[a.variant_label].id)
        finalMap[a.variant_label] = a;
    } else {
      if (!bgMap[a.variant_label] || a.id > bgMap[a.variant_label].id)
        bgMap[a.variant_label] = a;
    }
  });
  // Primary asset for review actions: final_ad > background/image_variant
  const assetMap = {};
  Object.keys({...finalMap, ...bgMap}).forEach(v => {
    assetMap[v] = finalMap[v] || bgMap[v];
  });
  // Track only the primary (one per variant) for counts
  currentDisplayedAssetIds = new Set(Object.values(assetMap).map(a => a.id));

  // Compute initial summary counts
  const counts = computeCounts();

  main.innerHTML = `
    <div class="render-detail">
      <div class="detail-header">
        <div class="detail-header-row1">
          <h2>Render #${data.id} — ${esc(title)}</h2>
          <div class="detail-actions">
            <button class="btn btn-approve${data.is_approved?' approved':''}" id="approveBtn"
                    onclick="toggleApprove(${data.id})">${data.is_approved?'✓ Approved':'Approve All'}</button>
            <button class="btn${data.is_favorite?' fav':''}" id="favBtn"
                    onclick="toggleFav(${data.id})" title="Star this render output">★</button>
            <button class="btn btn-export" onclick="exportRender(${data.id},'md')">Export MD</button>
            <button class="btn btn-export" onclick="exportRender(${data.id},'json')">Export JSON</button>
          </div>
        </div>
        <div id="summaryPills" class="summary-pills"></div>
        <div class="view-toolbar">
          <button class="view-btn${currentViewMode==='grid'?' active':''}" id="vbGrid" onclick="setView('grid')">⊞ Grid</button>
          <button class="view-btn${currentViewMode==='large'?' active':''}" id="vbLarge" onclick="setView('large')">▣ Large</button>
          <span class="shortcut-hint">Hover card · A approve · R reject · F fav · T ready</span>
        </div>
      </div>
      <div class="cards-feed" id="cardsFeed">
        <div id="readySection"></div>
        <div id="cardsGrid" class="${currentViewMode==='grid'?'cards-grid':'cards-large'}"></div>
      </div>
    </div>
  `;

  // Render all cards — one card per spec variant
  const gridEl = document.getElementById('cardsGrid');
  specs.forEach(spec => {
    const finalAsset = finalMap[spec.variant_label] || null;
    const bgAsset    = bgMap[spec.variant_label]    || null;
    const cardEl = buildCard(spec, finalAsset, bgAsset);
    gridEl.appendChild(cardEl);
  });

  updateSummaryUI();
}

/* ─── Build a variant card DOM element ─── */
function buildCard(spec, finalAsset, bgAsset) {
  // Primary asset for review actions: final_ad > background/image_variant
  const asset = finalAsset || bgAsset || null;
  const variantLabel = spec.variant_label || '';
  const badgeClass = {
    minimal:           'badge-minimal',
    bold_type:         'badge-bold-type',
    benefit_stack:     'badge-benefit-stack',
    social_proof:      'badge-social-proof',
    origin_story:      'badge-origin-story',
    lifestyle_tagline: 'badge-lifestyle-tagline',
    direct_response:   'badge-direct-response',
    premium:           'badge-premium',
    scroll_stopping:   'badge-scroll-stopping',
  }[variantLabel] || 'badge-minimal';
  const badgeLabel = variantLabel.replace(/_/g,' ');

  const card = document.createElement('div');
  card.className = 'variant-card';
  card.setAttribute('tabindex', '0');
  if (asset) {
    card.dataset.assetId = asset.id;
    card.addEventListener('mouseenter', () => { currentFocusedAssetId = asset.id; });
    card.addEventListener('focus',      () => { currentFocusedAssetId = asset.id; });
  }

  // Image — default to final_ad; toggle shows background
  let imgHtml = '';
  const displayAsset = finalAsset || bgAsset;
  if (displayAsset) {
    const p = displayAsset.asset_path_or_url || '';
    if (p && !p.startsWith('mock://')) {
      const imgSrc = `/api/render/asset/${displayAsset.id}/image`;
      const toggleBtn = (finalAsset && bgAsset)
        ? `<button class="bg-toggle-btn" title="Toggle background / final ad"
                   onclick="toggleBgFinal(this, ${finalAsset.id}, ${bgAsset.id})">📷 BG</button>`
        : (finalAsset
            ? `<span class="asset-type-badge">🎨 Final Ad</span>`
            : ``);
      imgHtml = `
        <img class="card-image" src="${imgSrc}" data-mode="final"
             alt="${esc(variantLabel)}" loading="lazy"
             onerror="this.closest('.card-image-wrap').innerHTML='<div class=card-image-placeholder>Image unavailable</div>'">
        ${toggleBtn}`;
    } else if (p) {
      imgHtml = `<div class="card-image-placeholder">${esc(p)}</div>`;
    } else {
      imgHtml = `<div class="card-image-placeholder">No image generated yet</div>`;
    }
  } else {
    imgHtml = `<div class="card-image-placeholder">No image generated yet</div>`;
  }

  const assetId = asset ? asset.id : null;
  const st = assetId ? assetState[assetId] : null;

  const readyBadge = (st && st.is_ready_to_test)
    ? `<span class="ready-badge-corner">🧪 Ready to Test</span>` : '';

  // Download link — always route through API endpoint (downloads final_ad if available)
  let downloadHtml = '';
  if (displayAsset && displayAsset.asset_path_or_url && !displayAsset.asset_path_or_url.startsWith('mock://')) {
    downloadHtml = `<a class="download-link" href="/api/render/asset/${displayAsset.id}/image" download>↓ Download</a>`;
  }

  // Spec detail ID — must be declared before actionsHtml uses it
  const specId = `spec-body-${variantLabel}-${assetId||'noasset'}`;

  // Action buttons (only if there's an asset)
  let actionsHtml = '';
  if (assetId) {
    const approveClass = st && st.review_status === 'approved' ? 'active-approve' : '';
    const rejectClass  = st && st.review_status === 'rejected'  ? 'active-reject'  : '';
    const favClass     = st && st.is_favorite                    ? 'active-fav'     : '';
    const readyClass   = st && st.is_ready_to_test               ? 'active-ready'   : '';
    actionsHtml = `
      <div class="card-actions">
        <button class="action-btn ${approveClass}" id="ab-approve-${assetId}"
                onclick="assetApprove(${assetId})">👍 Approve</button>
        <button class="action-btn ${rejectClass}"  id="ab-reject-${assetId}"
                onclick="assetReject(${assetId})">👎 Reject</button>
        <button class="action-btn ${favClass}"     id="ab-fav-${assetId}"
                onclick="assetFavorite(${assetId})">★ Fav</button>
        <button class="action-btn ${readyClass}"   id="ab-ready-${assetId}"
                onclick="assetReady(${assetId})">🧪 Ready</button>
        <button class="action-btn" id="ab-edit-${assetId}"
                onclick="toggleEditPanel('${specId}', ${assetId})">✏️ Edit</button>
        ${downloadHtml}
      </div>`;
  }

  // Spec detail body
  const tags = (spec.style_tags || []).map(t => `<span class="style-tag">${esc(t)}</span>`).join('');

  card.innerHTML = `
    <div class="card-header">
      <span class="variant-badge ${badgeClass}">${esc(badgeLabel)}</span>
      <span class="card-rationale">${esc(spec.variant_rationale || '')}</span>
      <button class="spec-toggle" onclick="toggleSpec('${specId}', this)">spec ▾</button>
    </div>
    <div class="card-image-wrap">
      ${imgHtml}
      ${readyBadge}
    </div>
    <div class="card-copy">
      <div class="card-headline">${esc(spec.headline_overlay || '')}</div>
      ${spec.cta_text ? `<div class="card-cta">${esc(spec.cta_text)}</div>` : ''}
    </div>
    ${actionsHtml}
    <div class="spec-detail" id="${specId}">
      <div class="spec-section">
        <h5>Visual Prompt</h5>
        <div class="prompt-box">${esc(spec.visual_prompt || '')}</div>
      </div>
      <div class="spec-section">
        <h5>Negative Prompt</h5>
        <div class="prompt-box">${esc(spec.negative_prompt || '')}</div>
      </div>
      <div class="spec-section">
        <h5>Overlay Copy</h5>
        <div class="overlay-grid">
          <span class="overlay-label">Headline</span><span>${esc(spec.headline_overlay||'')}</span>
          <span class="overlay-label">Body</span><span>${esc(spec.body_overlay||'')}</span>
          <span class="overlay-label">CTA</span><span>${esc(spec.cta_text||'')}</span>
        </div>
      </div>
      <div class="spec-section">
        <h5>Composition · Shot: ${esc(spec.shot_type||'')}</h5>
        <p>${esc(spec.composition||'')}</p>
      </div>
      <div class="spec-section">
        <h5>Background Style</h5>
        <p>${esc(spec.background_style||'')}</p>
      </div>
      ${spec.product_focus ? `<div class="spec-section"><h5>Product Focus</h5><p>${esc(spec.product_focus)}</p></div>` : ''}
      ${spec.text_hierarchy ? `<div class="spec-section"><h5>Text Hierarchy</h5><p>${esc(spec.text_hierarchy)}</p></div>` : ''}
      ${tags ? `<div class="spec-section"><h5>Style Tags</h5><div class="style-tags">${tags}</div></div>` : ''}
      ${assetId ? `
      <div class="edit-panel" id="edit-panel-${assetId}" style="display:none">
        <label>Visual Prompt</label>
        <textarea class="edit-textarea" id="edit-vp-${assetId}">${esc(spec.visual_prompt||'')}</textarea>
        <label style="margin-top:8px">Negative Prompt</label>
        <textarea class="edit-textarea" id="edit-np-${assetId}" style="min-height:56px">${esc(spec.negative_prompt||'')}</textarea>
        <label style="margin-top:8px">Extra Notes <span style="color:var(--muted2);font-weight:400;text-transform:none">(appended to prompt)</span></label>
        <textarea class="edit-notes" id="edit-notes-${assetId}" placeholder="e.g. warmer tones, add morning dew, darker background…"></textarea>
        <div class="edit-actions">
          <button class="btn-regen" id="regen-btn-${assetId}" onclick="regenAsset(${assetId})">🔄 Regenerate</button>
          <button class="btn-edit-cancel" onclick="toggleEditPanel('${specId}', ${assetId})">Cancel</button>
          <span class="regen-status" id="regen-status-${assetId}"></span>
        </div>
      </div>` : ''}
    </div>
  `;

  // Set initial card state classes
  if (st) applyCardState(card, st);

  return card;
}

function toggleSpec(id, btn) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.toggle('open');
  btn.textContent = el.classList.contains('open') ? 'spec ▴' : 'spec ▾';
}

function applyCardState(card, st) {
  card.classList.remove('state-approved','state-rejected','state-favorite');
  if (st.review_status === 'approved') card.classList.add('state-approved');
  if (st.review_status === 'rejected')  card.classList.add('state-rejected');
  if (st.is_favorite)                   card.classList.add('state-favorite');
}

/* ─── Summary ───────────────────────────── */
function computeCounts() {
  // Only count assets that are currently displayed (latest per variant, deduped)
  const displayed = [...currentDisplayedAssetIds].map(id => assetState[id]).filter(Boolean);
  return {
    total:    currentSpecs.length,
    images:   currentDisplayedAssetIds.size,
    approved: displayed.filter(s => s.review_status === 'approved').length,
    rejected: displayed.filter(s => s.review_status === 'rejected').length,
    fav:      displayed.filter(s => s.is_favorite).length,
    ready:    displayed.filter(s => s.is_ready_to_test).length,
  };
}

function updateSummaryUI() {
  const c = computeCounts();
  const el = document.getElementById('summaryPills');
  if (!el) return;
  const variantWord = c.total === 1 ? 'variant' : 'variants';
  const imgPill = c.images > 0
    ? `<span class="pill">${c.images} image${c.images !== 1 ? 's' : ''}</span>`
    : '';
  el.innerHTML = `
    <span class="pill">${c.total} ${variantWord}</span>
    ${imgPill}
    <span class="pill p-approved">${c.approved} ✓ approved</span>
    <span class="pill p-rejected">${c.rejected} ✗ rejected</span>
    <span class="pill p-fav">${c.fav} ★ fav</span>
    <span class="pill p-ready">${c.ready} 🧪 ready</span>
  `;

  // Ready-to-test section
  const readySec = document.getElementById('readySection');
  if (!readySec) return;
  const readyIds = Object.entries(assetState)
    .filter(([,s]) => s.is_ready_to_test)
    .map(([id]) => parseInt(id));
  if (readyIds.length) {
    const list = readyIds.map(id => {
      const card = document.querySelector(`[data-asset-id="${id}"]`);
      const label = card ? (card.querySelector('.variant-badge')?.textContent || id) : id;
      return `<span class="pill p-ready">${esc(String(label))}</span>`;
    }).join(' ');
    readySec.innerHTML = `<div class="ready-section"><div class="ready-section-title">Selected for Testing</div><div style="display:flex;gap:6px;flex-wrap:wrap">${list}</div></div>`;
  } else {
    readySec.innerHTML = '';
  }
}

/* ─── Background / Final-Ad toggle ─────── */
function toggleBgFinal(btn, finalId, bgId) {
  const wrap = btn.closest('.card-image-wrap');
  const img  = wrap && wrap.querySelector('.card-image');
  if (!img) return;
  const showingFinal = img.dataset.mode !== 'bg';
  if (showingFinal) {
    img.src = `/api/render/asset/${bgId}/image`;
    img.dataset.mode = 'bg';
    btn.textContent = '🎨 Final';
    btn.title = 'Show final composited ad';
  } else {
    img.src = `/api/render/asset/${finalId}/image`;
    img.dataset.mode = 'final';
    btn.textContent = '📷 BG';
    btn.title = 'Show raw background image';
  }
}

/* ─── View toggle ───────────────────────── */
function setView(mode) {
  currentViewMode = mode;
  const grid = document.getElementById('cardsGrid');
  if (grid) {
    grid.className = mode === 'grid' ? 'cards-grid' : 'cards-large';
  }
  document.getElementById('vbGrid')?.classList.toggle('active', mode==='grid');
  document.getElementById('vbLarge')?.classList.toggle('active', mode==='large');
}

/* ─── Asset actions ─────────────────────── */
async function assetApprove(assetId) {
  try {
    const res  = await fetch(`/api/render/asset/${assetId}/approve`, {method:'POST'});
    const data = await res.json();
    if (!data.ok) throw new Error(data.error);
    assetState[assetId].review_status = 'approved';
    refreshCardButtons(assetId);
    toast('✓ Approved');
    updateSummaryUI();
  } catch(e) { toast('Error: '+e.message, true); }
}

async function assetReject(assetId) {
  try {
    const res  = await fetch(`/api/render/asset/${assetId}/reject`, {method:'POST'});
    const data = await res.json();
    if (!data.ok) throw new Error(data.error);
    assetState[assetId].review_status = 'rejected';
    refreshCardButtons(assetId);
    toast('✗ Rejected');
    updateSummaryUI();
  } catch(e) { toast('Error: '+e.message, true); }
}

async function assetFavorite(assetId) {
  try {
    const res  = await fetch(`/api/render/asset/${assetId}/favorite`, {method:'POST'});
    const data = await res.json();
    if (!data.ok) throw new Error(data.error);
    assetState[assetId].is_favorite = data.is_favorite ? 1 : 0;
    refreshCardButtons(assetId);
    toast(data.is_favorite ? '★ Saved' : 'Removed from saved');
    updateSummaryUI();
  } catch(e) { toast('Error: '+e.message, true); }
}

async function assetReady(assetId) {
  try {
    const res  = await fetch(`/api/render/asset/${assetId}/ready`, {method:'POST'});
    const data = await res.json();
    if (!data.ok) throw new Error(data.error);
    assetState[assetId].is_ready_to_test = data.is_ready_to_test ? 1 : 0;
    refreshCardButtons(assetId);
    // update corner badge
    const card = document.querySelector(`[data-asset-id="${assetId}"]`);
    if (card) {
      const wrap = card.querySelector('.card-image-wrap');
      const existing = wrap ? wrap.querySelector('.ready-badge-corner') : null;
      if (data.is_ready_to_test) {
        if (wrap && !existing) {
          const badge = document.createElement('span');
          badge.className = 'ready-badge-corner';
          badge.textContent = '🧪 Ready to Test';
          wrap.appendChild(badge);
        }
      } else {
        if (existing) existing.remove();
      }
      applyCardState(card, assetState[assetId]);
    }
    toast(data.is_ready_to_test ? '🧪 Marked ready to test' : 'Removed from ready');
    updateSummaryUI();
  } catch(e) { toast('Error: '+e.message, true); }
}

function refreshCardButtons(assetId) {
  const st = assetState[assetId];
  if (!st) return;

  const approveBtn = document.getElementById(`ab-approve-${assetId}`);
  const rejectBtn  = document.getElementById(`ab-reject-${assetId}`);
  const favBtn     = document.getElementById(`ab-fav-${assetId}`);
  const readyBtn   = document.getElementById(`ab-ready-${assetId}`);

  if (approveBtn) {
    approveBtn.className = 'action-btn' + (st.review_status==='approved'?' active-approve':'');
  }
  if (rejectBtn) {
    rejectBtn.className = 'action-btn' + (st.review_status==='rejected'?' active-reject':'');
  }
  if (favBtn) {
    favBtn.className = 'action-btn' + (st.is_favorite?' active-fav':'');
  }
  if (readyBtn) {
    readyBtn.className = 'action-btn' + (st.is_ready_to_test?' active-ready':'');
  }

  // Update card border/bg state
  const card = document.querySelector(`[data-asset-id="${assetId}"]`);
  if (card) applyCardState(card, st);
}

/* ─── Render-level actions ──────────────── */
async function toggleApprove(id) {
  const res  = await fetch(`/api/render/${id}/approve`, {method:'POST'});
  const data = await res.json();
  if (data.ok) {
    const btn = document.getElementById('approveBtn');
    btn.classList.toggle('approved', data.is_approved);
    btn.textContent = data.is_approved ? '✓ Approved' : 'Approve All';
    loadRenderList();
    toast(data.is_approved ? 'Render approved' : 'Approval removed');
  }
}

async function toggleFav(id) {
  const res  = await fetch(`/api/render/${id}/favorite`, {method:'POST'});
  const data = await res.json();
  if (data.ok) {
    const btn = document.getElementById('favBtn');
    btn.classList.toggle('fav', data.is_favorite);
    loadRenderList();
    toast(data.is_favorite ? 'Saved ★' : 'Removed from saved');
  }
}

/* ─── Edit prompt / Regenerate ─────────── */
function toggleEditPanel(specId, assetId) {
  // Open spec detail first
  const specEl = document.getElementById(specId);
  if (specEl && !specEl.classList.contains('open')) {
    specEl.classList.add('open');
    const btn = document.querySelector(`[onclick="toggleSpec('${specId}', this)"]`);
    if (btn) btn.textContent = 'spec ▴';
  }
  const panel = document.getElementById(`edit-panel-${assetId}`);
  if (!panel) return;
  const isOpen = panel.style.display !== 'none';
  panel.style.display = isOpen ? 'none' : 'block';
  const editBtn = document.getElementById(`ab-edit-${assetId}`);
  if (editBtn) editBtn.classList.toggle('active-approve', !isOpen);
  if (!isOpen) panel.querySelector('textarea')?.focus();
}

async function regenAsset(assetId) {
  const btn    = document.getElementById(`regen-btn-${assetId}`);
  const status = document.getElementById(`regen-status-${assetId}`);
  const vp     = document.getElementById(`edit-vp-${assetId}`)?.value.trim();
  const np     = document.getElementById(`edit-np-${assetId}`)?.value.trim();
  const notes  = document.getElementById(`edit-notes-${assetId}`)?.value.trim();
  const model  = getSelectedModel();

  btn.disabled = true;
  btn.textContent = '⏳ Generating…';
  if (status) status.textContent = '';

  try {
    const res  = await fetch(`/api/render/asset/${assetId}/regenerate`, {
      method:  'POST',
      headers: {'Content-Type': 'application/json'},
      body:    JSON.stringify({ visual_prompt: vp, negative_prompt: np, extra_notes: notes, model }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);

    const newAsset = data.asset;
    const newId    = data.new_asset_id;

    // Update assetState and displayed set with new asset
    assetState[newId] = { review_status: 'pending', is_favorite: 0, is_ready_to_test: 0 };
    currentDisplayedAssetIds.delete(assetId);
    currentDisplayedAssetIds.add(newId);

    // Swap the image in the card
    const card = document.querySelector(`[data-asset-id="${assetId}"]`);
    if (card) {
      // Update card to reference new asset id
      card.dataset.assetId = newId;
      card.addEventListener('mouseenter', () => { currentFocusedAssetId = newId; });
      card.addEventListener('focus',      () => { currentFocusedAssetId = newId; });

      // Replace entire image wrap content (handles case where onerror replaced <img> with a div)
      const imgWrap = card.querySelector('.card-image-wrap');
      if (imgWrap) {
        const readyBadge = imgWrap.querySelector('.ready-badge-corner');
        imgWrap.innerHTML = `<img class="card-image" src="/api/render/asset/${newId}/image" alt="regenerated" loading="lazy" onerror="this.closest('.card-image-wrap').innerHTML='<div class=card-image-placeholder>Image unavailable</div>'">`;
        if (readyBadge) imgWrap.appendChild(readyBadge);
      }

      // Update button IDs and onclick handlers.
      // Use explicit function names — auto-capitalising 'fav' → 'assetFav'
      // but the real function is assetFavorite.
      const ACTION_FN = {
        approve: 'assetApprove',
        reject:  'assetReject',
        fav:     'assetFavorite',
        ready:   'assetReady',
        edit:    'assetEdit',
      };
      Object.keys(ACTION_FN).forEach(action => {
        const b = document.getElementById(`ab-${action}-${assetId}`);
        if (b) {
          b.id = `ab-${action}-${newId}`;
          b.setAttribute('onclick', `${ACTION_FN[action]}(${newId})`);
        }
      });
      // Fix edit button onclick
      const editBtn = document.getElementById(`ab-edit-${newId}`);
      if (editBtn) {
        const specId = card.querySelector('.spec-detail')?.id;
        if (specId) editBtn.setAttribute('onclick', `toggleEditPanel('${specId}', ${newId})`);
      }
      // Fix regen button
      const regenBtnNew = document.getElementById(`regen-btn-${assetId}`);
      if (regenBtnNew) {
        regenBtnNew.id = `regen-btn-${newId}`;
        regenBtnNew.setAttribute('onclick', `regenAsset(${newId})`);
      }
      // Fix download link
      const dlLink = card.querySelector('.download-link');
      if (dlLink) dlLink.href = `/api/render/asset/${newId}/image`;

      applyCardState(card, assetState[newId]);
    }

    if (status) status.textContent = '✓ New image ready';
    toast('✓ Regenerated successfully');
    updateSummaryUI();
  } catch(e) {
    if (status) status.textContent = 'Failed: ' + e.message;
    toast('Regeneration failed: ' + e.message, true);
  } finally {
    btn.disabled = false;
    btn.textContent = '🔄 Regenerate';
  }
}

/* ─── Export ────────────────────────────── */
async function exportRender(id, format) {
  const res  = await fetch(`/api/render/${id}`);
  const data = await res.json();
  const specs = data.render_specs || [];

  if (format === 'json') {
    const blob = new Blob([JSON.stringify(specs, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `render_${id}_specs.json`;
    a.click();
  } else {
    const md = specs.map(s => [
      `## ${(s.variant_label||'').replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase())} Variant`,
      `**Concept:** ${s.concept_title||''}`,
      `**Aspect ratio:** ${s.aspect_ratio||''}  **Shot:** ${s.shot_type||''}`,
      `### Visual Prompt\n${s.visual_prompt||''}`,
      `### Negative Prompt\n${s.negative_prompt||''}`,
      `### Overlay\n- Headline: ${s.headline_overlay||''}\n- Body: ${s.body_overlay||''}\n- CTA: ${s.cta_text||''}`,
      `---`,
    ].join('\n\n')).join('\n\n');

    try {
      await navigator.clipboard.writeText(md);
      toast('Render specs copied to clipboard');
    } catch {
      const blob = new Blob([md], {type:'text/plain'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `render_${id}_specs.md`;
      a.click();
    }
  }
}
</script>
